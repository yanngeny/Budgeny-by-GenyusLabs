name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  apk:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Construire le web et générer le projet Android
        run: |
          npm run build:web
          npx cap add android
          npm run android:setup
          npx cap sync android

      - name: Version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; else VER="0.0.0-dev"; fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${VER}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compiler
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi

      - name: Signer et nommer l'APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p dist
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "${KEY_ALIAS:-budgeny}" \
              --out "dist/Budgeny-${VER}.apk" android/app/build/outputs/apk/release/app-release-unsigned.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Budgeny-${VER}-debug.apk"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: Budgeny-apk
          path: dist/*.apk

      - name: Publier la release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
